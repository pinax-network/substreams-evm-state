[package]
name = "evm-state"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Verified selective EVM checkpoints over native ClickHouse Substreams output"
default-run = "evm-state"

[dependencies]
alloy-primitives = { version = "=1.5.7", features = ["rlp", "serde"] }
alloy-rlp = "=0.3.16"
alloy-trie = "=0.9.5"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crypto_secretbox = "=0.1.1"
fs2 = "=0.4.3"
hex = "0.4"
hostname = "0.4"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
signal-hook = "0.3"
flate2 = "1"
tar = "0.4"
minlz = { version = "1.2.3", default-features = false, features = ["std", "s2"] }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
http-body-util = "0.1"
tokio-stream = "0.1"
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[dev-dependencies]
