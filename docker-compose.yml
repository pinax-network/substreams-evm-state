services:
  postgres:
    image: postgres:16
    container_name: substreams-evm-state-pg
    environment:
      POSTGRES_USER: dev-node
      POSTGRES_PASSWORD: insecure-change-me-in-prod
      POSTGRES_DB: dev-node
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev-node -d dev-node"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
