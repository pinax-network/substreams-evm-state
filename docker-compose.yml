services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.33.24
    container_name: substreams-evm-state-ch
    environment:
      CLICKHOUSE_USER: evm_state
      CLICKHOUSE_PASSWORD: local-development-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:18123:8123"
    volumes:
      - ${CH_DATA_SOURCE:-ch_data}:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user evm_state --password local-development-only --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  postgres:
    image: postgres:16
    container_name: substreams-evm-state-pg
    environment:
      POSTGRES_USER: dev-node
      POSTGRES_PASSWORD: insecure-change-me-in-prod
      POSTGRES_DB: dev-node
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev-node -d dev-node"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  ch_data:
