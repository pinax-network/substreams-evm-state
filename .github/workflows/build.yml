name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Test from a clean checkout
        run: cargo test --locked --workspace
      - name: Build Substreams module
        run: cargo build --locked --release --target wasm32-unknown-unknown

  clickhouse:
    name: Checkpoints and native ClickHouse recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evm_test
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: evm_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U evm_test -d evm_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.3.33.24
        env:
          CLICKHOUSE_USER: evm_state
          CLICKHOUSE_PASSWORD: local-development-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 18123:8123
          - 19000:9000
        options: >-
          --health-cmd "clickhouse-client --user evm_state --password local-development-only --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tests/grpc_proxy/go.sum
      - name: Install pinned CLI with Rust
        run: |
          cargo run --locked -p evm-state -- install-substreams
          echo "$PWD/localdata/toolchain/bin" >> "$GITHUB_PATH"
      - name: Install remaining migration baseline dependencies
        run: |
          python -m pip install -r requirements-test.lock
          # Exercise the installed wheel and its bundled SQL, not an editable
          # checkout that could hide missing package data.
          python -m pip install --no-deps .
          python -m pip check
      - name: Build the release package from source
        run: make build
      - name: Verify Rust publication, native preparation and cursor recovery
        run: cargo test --locked -p evm-state --test clickhouse_state --test native_prepare --test portable_database --test bootstrap_database -- --ignored
      - name: Verify proofs, publication, ownership and real sink recovery
        env:
          PG_DSN: postgresql://evm_test:local-development-only@127.0.0.1:15432/evm_test
        run: python -m pytest --run-clickhouse --run-database-crash --run-postgres -q
