name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Test from a clean checkout
        run: cargo test --locked
      - name: Build Substreams module
        run: cargo build --locked --release --target wasm32-unknown-unknown
