name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Rust-only implementation
        run: |
          unexpected=$(git ls-files '*.py' '*.go' 'go.mod' 'go.sum' 'requirements*.txt' 'requirements*.lock' 'pyproject.toml')
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected"
            exit 1
          fi
      - name: Install pinned toolchain
        run: rustup show
      - name: Test from a clean checkout
        run: cargo test --locked --workspace
      - name: Build Substreams module
        run: cargo build --locked --release --target wasm32-unknown-unknown

  clickhouse:
    name: Checkpoints and native ClickHouse recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evm_test
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: evm_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U evm_test -d evm_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.3.33.24
        env:
          CLICKHOUSE_USER: evm_state
          CLICKHOUSE_PASSWORD: local-development-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 18123:8123
          - 19000:9000
        options: >-
          --health-cmd "clickhouse-client --user evm_state --password local-development-only --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CLI with Rust
        run: |
          cargo run --locked -p evm-state -- install-substreams
          echo "$PWD/localdata/toolchain/bin" >> "$GITHUB_PATH"
      - name: Build the release package from source
        run: make build
      - name: Verify Rust publication, native preparation and cursor recovery
        env:
          PG_DSN: postgresql://evm_test:local-development-only@127.0.0.1:15432/evm_test
        run: cargo test --locked -p evm-state --test clickhouse_state --test native_prepare --test portable_database --test bootstrap_database --test capacity_workload --test publication_parity --test postgres_database -- --ignored
      - name: Verify Rust hard database restart in its own disposable container
        run: cargo test --locked -p evm-state --test database_crash -- --ignored
